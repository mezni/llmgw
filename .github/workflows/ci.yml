name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked
      - name: Build with warnings denied
        run: RUSTFLAGS=-Dwarnings cargo build --locked
      - name: Install sqlx CLI
        run: cargo install sqlx-cli --locked --no-default-features --features sqlite
      - name: Migration
        run: |
          touch /tmp/llmgw-ci.db
          DATABASE_URL=sqlite:///tmp/llmgw-ci.db sqlx migrate run --source crates/storage/migrations
          sqlite3 /tmp/llmgw-ci.db '.schema projects'
          sqlite3 /tmp/llmgw-ci.db '.schema api_keys'
          sqlite3 /tmp/llmgw-ci.db '.schema requests'

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: admin-ui/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build

  drift-and-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: admin-ui/package-lock.json
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Install dependencies for generated client check
        run: npm ci
        working-directory: admin-ui
      - name: OpenAPI drift
        run: git diff --exit-code -- docs/openapi.json admin-ui/src/api/schema.d.ts
